<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGradient)"/>

  <!-- Shine overlay -->
  <rect x="32" y="32" width="448" height="224" rx="96" ry="96" fill="url(#shineGradient)" opacity="0.5"/>

  <!-- Document/merge icon in background -->
  <g opacity="0.15">
    <!-- Left document -->
    <rect x="140" y="140" width="100" height="140" rx="8" fill="white"/>
    <line x1="160" y1="170" x2="220" y2="170" stroke="white" stroke-width="4" opacity="0.6"/>
    <line x1="160" y1="195" x2="220" y2="195" stroke="white" stroke-width="4" opacity="0.6"/>
    <line x1="160" y1="220" x2="220" y2="220" stroke="white" stroke-width="4" opacity="0.6"/>

    <!-- Right document -->
    <rect x="272" y="140" width="100" height="140" rx="8" fill="white"/>
    <line x1="292" y1="170" x2="352" y2="170" stroke="white" stroke-width="4" opacity="0.6"/>
    <line x1="292" y1="195" x2="352" y2="195" stroke="white" stroke-width="4" opacity="0.6"/>
    <line x1="292" y1="220" x2="352" y2="220" stroke="white" stroke-width="4" opacity="0.6"/>

    <!-- Merge arrows -->
    <path d="M 240 200 L 272 200" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <path d="M 265 193 L 272 200 L 265 207" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Merged document below -->
    <rect x="206" y="300" width="100" height="140" rx="8" fill="white"/>
    <line x1="226" y1="330" x2="286" y2="330" stroke="white" stroke-width="4" opacity="0.6"/>
    <line x1="226" y1="355" x2="286" y2="355" stroke="white" stroke-width="4" opacity="0.6"/>
    <line x1="226" y1="380" x2="286" y2="380" stroke="white" stroke-width="4" opacity="0.6"/>
    <line x1="226" y1="405" x2="286" y2="405" stroke="white" stroke-width="4" opacity="0.6"/>
  </g>

  <!-- "AD" Text -->
  <text x="256" y="320" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="200" font-weight="700" text-anchor="middle" fill="white" filter="url(#textShadow)">AD</text>

  <!-- Subtle bottom label -->
  <text x="256" y="430" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="500" text-anchor="middle" fill="white" opacity="0.9">Merger</text>

  <!-- Border highlight -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="none" stroke="white" stroke-width="4" opacity="0.1"/>
</svg>
